spring:
  application:
    name: api

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

jwt:
  key: ${JWT_KEY}
  access-token-expiration: 3600000
  refresh-token-expiration: 3155695200000

price:
  admin: 1000

file-storage:
  upload-dir: uploads
  max-file-size: 10485760 # 10MB
  allowed-file-types:
    - image/jpeg
    - image/png
    - image/webp

midtrans:
  api-url: https://api.sandbox.midtrans.com/v2/
  snap-url: https://app.sandbox.midtrans.com/
  server-key: ${MIDTRANS_SERVER_KEY}

firebase:
  service-account: ${FIREBASE_SERVICE_ACCOUNT}

demo:
  enabled: ${DEMO_ENABLED}